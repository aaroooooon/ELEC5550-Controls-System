; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = espidf

board_build.flash_size = 8MB
board_build.flash_mode = qio
board_build.partitions = partitions.csv

; The XIAO ESP32S3 has no USB-UART chip; it enumerates via the S3's built-in
; USB peripheral. Delete this line to go back to auto-detection if COM3 turns
; out to be the wrong device.
upload_port = COM3
upload_speed = 921600

; The Edge Impulse library in lib/ is built as an ESP-IDF component (see
; components/weed_detection_model). Keep PlatformIO's library finder from also
; trying to compile it as a PlatformIO library. Every model version kept in lib/
; must be listed here, including ones no longer in use.
lib_ignore =
    weed-detection-cpp-mcu-v5-impulse-#1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
